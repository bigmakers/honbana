name: BarcodeReview
options:
  bundleIdPrefix: com.bigdrives
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ja

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_LANGUAGE: ja
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: NO

fileGroups:
  - BarcodeReview/ja.lproj
  - BarcodeReview/en.lproj

targets:
  BarcodeReview:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BarcodeReview
        excludes:
          - "Info.plist"
    info:
      path: BarcodeReview/Info.plist
      properties:
        NSCameraUsageDescription: "本のバーコードを読み取るためにカメラを使用します"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleDisplayName: "ホンダナ"
        CFBundleLocalizations:
          - ja
          - en
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bigdrives.BarcodeReview
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"

name: BarcodeReview
options:
  bundleIdPrefix: com.bigdrives
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ja

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_LANGUAGE: ja
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: NO

fileGroups:
  - BarcodeReview/ja.lproj
  - BarcodeReview/en.lproj

targets:
  BarcodeReview:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BarcodeReview
        excludes:
          - "Info.plist"
          - "BarcodeReview.entitlements"
    entitlements:
      path: BarcodeReview/BarcodeReview.entitlements
      properties:
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.bigdrives.BarcodeReview
    info:
      path: BarcodeReview/Info.plist
      properties:
        NSCameraUsageDescription: "本のバーコードを読み取るためにカメラを使用します"
        NSPhotoLibraryAddUsageDescription: "メモに添付した画像を「写真」アプリに書き出すために使用します"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        CFBundleDisplayName: "ホンダナ"
        CFBundleLocalizations:
          - ja
          - en
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bigdrives.BarcodeReview
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: "6"
        TARGETED_DEVICE_FAMILY: "1"
